plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-suite:6.0.0'

    //Selenium
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.50.0'

    //Cucumber
    testImplementation 'io.cucumber:cucumber-java:8.0.3'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.3'

    // Jackson - JSON support for Cucumber reports
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.20.1'
}

test {
    useJUnitPlatform()
}